# Cross-repo contract: this wrapper against the real minecraft-bot. Advisory.
#
# The wrapper does not depend on the bot: it is a standalone HTTP wrapper and
# any client may consume it. The bot depends on us, and the bot's own contract
# job (minecraft-bot .github/workflows/contract.yml, against our main and the
# release the setup suite pins) is where a disagreement fails. A bot that has
# not caught up with a change here is the bot's to fix, so this job never
# fails the wrapper's CI: a failing check is reported as a warning and in the
# job summary, so a change here that a bot release will need to follow is
# still seen in the PR that makes it.
#
# The check itself lives in the bot repo (scripts/e2e-wrapper-contract.mjs):
# it runs the bot's real serverAccess against a real instance of this wrapper,
# because the bot casts our JSON to its own types — a field renamed here
# type-checks on both sides and only surfaces as a remote instance quietly
# returning undefined. `npm test` here cannot see that; this can.
name: bot contract

on:
  push:
    paths:
      - "src/**"
      - "openapi.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "src/**"
      - "openapi.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/contract.yml"
  workflow_dispatch:
    inputs:
      bot_ref:
        description: "minecraft-bot ref to test against"
        required: false
        default: main

permissions:
  contents: read

env:
  BOT_REPO: LetsGaming/minecraft-bot
  # Read through the environment in shell steps, never interpolated into
  # the script text, so a crafted ref cannot become shell syntax.
  BOT_REF: ${{ inputs.bot_ref || 'main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the wrapper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: api-wrapper
          persist-credentials: false

      - name: Check out the bot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.BOT_REPO }}
          ref: ${{ env.BOT_REF }}
          path: bot
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The check imports the bot's built core, whose engines require
          # >= 22.13 for node:sqlite.
          node-version: 24

      - name: Build the wrapper
        working-directory: api-wrapper
        run: npm ci && npm run build

      - name: Build the bot
        id: bot-build
        # Advisory like the check: a bot that does not build is not ours to fix.
        continue-on-error: true
        working-directory: bot
        run: npm ci && npm run build

      - name: Contract check
        id: contract
        if: steps.bot-build.outcome == 'success'
        # Advisory (see the header): the bot lagging behind does not fail us.
        continue-on-error: true
        working-directory: bot
        env:
          WRAPPER_DIR: ${{ github.workspace }}/api-wrapper
          E2E_DUMP_WRAPPER_LOG: "1"
        run: |
          if ! node -e "process.exit(require('./package.json').scripts['e2e:contract'] ? 0 : 1)"; then
            echo "${BOT_REPO}@${BOT_REF} has no 'e2e:contract' script; nothing to check against."
            exit 1
          fi
          npm run e2e:contract

      - name: Report a bot that has not caught up
        if: steps.bot-build.outcome == 'failure' || steps.contract.outcome == 'failure'
        env:
          BUILD_FAILED: ${{ steps.bot-build.outcome == 'failure' }}
        run: |
          if [ "$BUILD_FAILED" = "true" ]; then
            msg="${BOT_REPO}@${BOT_REF} does not build (see the Build the bot step), so the contract was not checked. The wrapper is not blocked."
          else
            msg="${BOT_REPO}@${BOT_REF} disagrees with this wrapper (see the Contract check step). The wrapper is not blocked; the bot needs a change before it can use this version."
          fi
          echo "::warning title=bot contract::${msg}"
          {
            echo "### Bot contract: ${BOT_REPO}@${BOT_REF} has not caught up"
            echo
            echo "${msg}"
            echo
            echo "Advisory only. The failure blocks the bot's own CI (its contract job runs against this wrapper's main), not this one."
          } >> "$GITHUB_STEP_SUMMARY"
