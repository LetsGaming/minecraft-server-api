# Publishes a release when a version tag is pushed (git tag v4.1.0 && git push origin v4.1.0).
#
# Two jobs, so nothing that runs third-party code holds a write token: `build`
# installs dependencies, checks, tests and packs with a read-only token and
# refuses a tag that is not on main; `publish` only downloads that artifact,
# attests its provenance and creates the release.
#
# The tag must match package.json and CHANGELOG.md must have that version's
# section. The job runs the checks, builds, packs mc-api-server-<v>.tar.gz
# (scripts/pack-release.mjs: dist/ and what a host runs, no sources), and
# attaches it with its .sha256 to a GitHub Release whose notes are the
# changelog section.
#
# minecraft-server-setup installs the release named in its
# api-server-release.json. With the SETUP_REPO_TOKEN secret set (a fine-grained
# token with contents and pull-requests write on that repository), this job
# also opens the pull request there that moves the pin to this release; its
# Wrapper contract workflow then tests the release against the bot. Without the
# secret the bump is done by hand (docs/wrapper-release.md in that repository).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SETUP_REPO: LetsGaming/minecraft-server-setup

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run openapi:check

      - name: Pack
        id: pack
        run: node scripts/pack-release.mjs --expect-version "${GITHUB_REF_NAME#v}" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release/

      - name: Attest the tarball's provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/mc-api-server-${{ needs.build.outputs.version }}.tar.gz

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/mc-api-server-$VERSION.tar.gz" \
            "release/mc-api-server-$VERSION.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "mc-api-server $VERSION" \
            --notes-file release/notes.md \
            --verify-tag

      - name: Open the pin bump in minecraft-server-setup
        env:
          GH_TOKEN: ${{ secrets.SETUP_REPO_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SETUP_REPO_TOKEN is not set; bump api-server-release.json in $SETUP_REPO by hand."
            exit 0
          fi
          branch="api-server-release-v$VERSION"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SETUP_REPO}.git" setup
          cd setup
          if [ ! -f api-server-release.json ]; then
            echo "::notice::$SETUP_REPO has no api-server-release.json on main yet; pin $VERSION ($SHA256) by hand."
            exit 0
          fi
          git checkout -b "$branch"
          node -e '
            const fs = require("fs");
            const pin = JSON.parse(fs.readFileSync("api-server-release.json", "utf8"));
            pin.version = process.env.VERSION;
            pin.sha256 = process.env.SHA256;
            fs.writeFileSync("api-server-release.json", JSON.stringify(pin, null, 2) + "\n");
          '
          if git diff --quiet; then
            echo "::notice::$SETUP_REPO already pins $VERSION."
            exit 0
          fi
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git commit -am "chore: pin API wrapper $VERSION"
          git push origin "$branch"
          {
            echo "Moves \`api-server-release.json\` to [mc-api-server $VERSION](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME})."
            echo
            echo "sha256: \`$SHA256\`"
            echo
            echo "## Changes in this release"
            echo
            cat ../release/notes.md
          } > ../pr-body.md
          gh pr create --repo "$SETUP_REPO" --base main --head "$branch" \
            --title "chore: pin API wrapper $VERSION" --body-file ../pr-body.md
